# Verificación automática en cada push y pull request: lint, pruebas y build.
# Si algo falla, GitHub lo marca con una ✗ roja en el commit.
name: Verificación

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
